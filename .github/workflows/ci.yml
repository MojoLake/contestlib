name: Test and build handbook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run C++ tests
        run: make test
      - uses: typst-community/setup-typst@v4
      - name: Build handbook PDF
        run: make handbook
      - uses: actions/upload-artifact@v4
        with:
          name: contest-handbook
          path: build/handbook.pdf
